<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2563EB" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGrad)" filter="url(#glow)" opacity="0.3"/>
  
  <!-- Main background -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGrad)"/>
  
  <!-- Document shape with chat bubble cutout -->
  <g transform="translate(16, 14)">
    <!-- Document body -->
    <path d="M0 0h32v28a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V0z" fill="url(#iconGrad)"/>
    <!-- Fold corner -->
    <path d="M22 0v10h10" stroke="#2563EB" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Chat bubble merged into document -->
    <ellipse cx="16" cy="20" rx="11" ry="8" fill="#2563EB" opacity="0.2"/>
    <ellipse cx="16" cy="20" rx="9" ry="6" fill="#2563EB"/>
    <!-- Dots in chat bubble -->
    <circle cx="11" cy="20" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="16" cy="20" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="21" cy="20" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- AI sparkle on top right -->
    <g transform="translate(28, 4)" fill="#FBBF24">
      <polygon points="2,0 2.5,2.5 5,2.5 3,4 3.5,6.5 2,5 0.5,6.5 1,4 -1,2.5 1.5,2.5"/>
    </g>
  </g>
  
  <!-- Subtle ring accent -->
  <circle cx="32" cy="32" r="29" stroke="#FFFFFF" stroke-width="0.5" fill="none" opacity="0.1"/>
</svg>